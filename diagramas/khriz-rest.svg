<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#087E81"/></marker></defs>
<rect width="100%" height="100%" fill="#F6F5F0"/>
<text x="700.0" y="66.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#132F3A">Registro de solicitudes SGRA mediante REST</text>
<text x="700.0" y="124.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">PROTOTIPO LOCAL · Datos ficticios · Khriz Coronel</text>
<rect x="50" y="205" width="320" height="120" rx="12" fill="#FFFFFF" stroke="#CDD8D6"/>
<text x="210.0" y="256.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Cliente externo</text>
<text x="210.0" y="288.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Envía solicitud individual</text>
<rect x="540" y="205" width="320" height="120" rx="12" fill="#DFEEEB" stroke="#CDD8D6"/>
<text x="700.0" y="256.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">API REST</text>
<text x="700.0" y="288.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Valida campos obligatorios</text>
<rect x="1030" y="205" width="320" height="120" rx="12" fill="#FFFFFF" stroke="#CDD8D6"/>
<text x="1190.0" y="256.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Registro en memoria</text>
<text x="1190.0" y="288.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Estado Pendiente</text>
<line x1="370" y1="240" x2="540" y2="240" stroke="#087E81" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="455.0" y="200.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#132F3A">POST + JSON</text>
<line x1="540" y1="295" x2="370" y2="295" stroke="#087E81" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="455.0" y="352.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#132F3A">201 + ID / 400</text>
<line x1="860" y1="265" x2="1030" y2="265" stroke="#087E81" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="945.0" y="229.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#132F3A">Solo datos válidos</text>
<text x="700.0" y="424.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#132F3A">subjectId · sessionTypeId = 1 · reason · preferredSchedule</text>
<text x="700.0" y="478.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#132F3A">Sin BD ni sesión real. Reiniciar borra los registros. Reintentar puede duplicarlos.</text>
<text x="700.0" y="590.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#132F3A">EVOLUCIÓN PROPUESTA · Confirmación del último cupo</text>
<rect x="160" y="665" width="400" height="120" rx="12" fill="#FFFFFF" stroke="#CDD8D6"/>
<text x="360.0" y="716.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Nodo A</text>
<text x="360.0" y="748.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Autoridad para confirmar cupos</text>
<rect x="840" y="665" width="400" height="120" rx="12" fill="#FFFFFF" stroke="#CDD8D6"/>
<text x="1040.0" y="716.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Nodo B</text>
<text x="1040.0" y="748.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#132F3A">Coordina la misma decisión</text>
<line x1="560" y1="725" x2="840" y2="725" stroke="#087E81" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="700.0" y="681.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#132F3A">Coordinación</text>
<text x="700.0" y="841.5" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#132F3A">En una partición, suspender la confirmación si no puede garantizarse el cupo único.</text>
<text x="700.0" y="891.0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#132F3A">Sin partición, esperar coordinación añade latencia. Esta topología no está implementada.</text>
